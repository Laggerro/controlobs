<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <script src="/socket.io/socket.io.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@500;700&family=Montserrat:wght@600;700&family=Impact&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: transparent;
      margin: 0;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    .gafete-box {
      position: absolute;
      padding: 12px 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      gap: 12px;
      transform: translate(-50%, -50%);
      pointer-events: none;
      opacity: 0;
      box-sizing: border-box;
      border-style: solid;
    }

    /* POSICIONES DEL LOGO */
    .logo-top { flex-direction: column; text-align: center; }
    .logo-bottom { flex-direction: column-reverse; text-align: center; }
    .logo-right { flex-direction: row-reverse; }
    .logo-left { flex-direction: row; }

    /* ESTADOS Y ANIMACIONES */
    .hidden { display: none !important; }

    .in-slideLeft { animation: slideLeftIn 0.5s forwards ease-out; }
    .in-slideRight { animation: slideRightIn 0.5s forwards ease-out; }
    .in-slideUp { animation: slideUpIn 0.5s forwards ease-out; }
    .in-bounce { animation: bounceIn 0.6s forwards cubic-bezier(0.68, -0.55, 0.265, 1.55); }
    .in-zoom { animation: zoomIn 0.4s forwards ease-out; }
    .in-fadeIn { animation: fadeIn 0.5s forwards; }

    .out-slideLeft { animation: slideLeftOut 0.5s forwards ease-in; }
    .out-slideRight { animation: slideRightOut 0.5s forwards ease-in; }
    .out-slideUp { animation: slideUpOut 0.5s forwards ease-in; }
    .out-zoom { animation: zoomOut 0.4s forwards ease-in; }
    .out-fadeOut { animation: fadeOut 0.5s forwards; }

    @keyframes fadeIn { to { opacity: 1; } }
    @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
    @keyframes slideLeftIn { from { transform: translate(calc(-50% - 150px), -50%); opacity: 0; } to { transform: translate(-50%, -50%); opacity: 1; } }
    @keyframes slideLeftOut { from { transform: translate(-50%, -50%); opacity: 1; } to { transform: translate(calc(-50% - 150px), -50%); opacity: 0; } }
    @keyframes slideRightIn { from { transform: translate(calc(-50% + 150px), -50%); opacity: 0; } to { transform: translate(-50%, -50%); opacity: 1; } }
    @keyframes slideRightOut { from { transform: translate(-50%, -50%); opacity: 1; } to { transform: translate(calc(-50% + 150px), -50%); opacity: 0; } }
    @keyframes slideUpIn { from { transform: translate(-50%, calc(-50% + 100px)); opacity: 0; } to { transform: translate(-50%, -50%); opacity: 1; } }
    @keyframes slideUpOut { from { transform: translate(-50%, -50%); opacity: 1; } to { transform: translate(-50%, calc(-50% + 100px)); opacity: 0; } }
    @keyframes bounceIn { 0% { transform: translate(-50%, -50%) scale(0.3); opacity: 0; } 50% { transform: translate(-50%, -50%) scale(1.05); opacity: 1; } 100% { transform: translate(-50%, -50%) scale(1); opacity: 1; } }
    @keyframes zoomIn { from { transform: translate(-50%, -50%) scale(0); opacity: 0; } to { transform: translate(-50%, -50%) scale(1); opacity: 1; } }
    @keyframes zoomOut { from { transform: translate(-50%, -50%) scale(1); opacity: 1; } to { transform: translate(-50%, -50%) scale(0); opacity: 0; } }
  </style>
</head>
<body>
  <div id="container"></div>

  <script>
    const socket = io();

    socket.on('sync-gafetes', (gafetes) => {
      const container = document.getElementById('container');

      Object.values(gafetes).forEach(g => {
        let el = document.getElementById(g.id);

        if (!el) {
          el = document.createElement('div');
          el.id = g.id;
          el.className = 'gafete-box hidden';
          el.innerHTML = `
            <span class="g-emoji" style="display:none;"></span>
            <img class="g-img" style="display:none; object-fit:contain;">
            <div>
              <div class="g-l1" style="font-weight:800; line-height:1.2;"></div>
              <div class="g-l2" style="margin-top:2px; line-height:1.2;"></div>
            </div>
          `;
          container.appendChild(el);
        }

        // Posicionamiento dinámico[cite: 13]
        el.style.left = (g.posX || 0) + '%';
        el.style.top = (g.posY || 0) + '%';

        // Estilos CSS dinámicos
        el.style.borderRadius = g.borderRadius || '12px';
        el.style.fontFamily = g.fontFamily || 'system-ui, sans-serif';
        el.style.borderWidth = '2px';
        el.style.borderColor = g.borderColor || '#3b82f6';

        const r = parseInt((g.bgColor || '#0f172a').slice(1, 3), 16);
        const gCol = parseInt((g.bgColor || '#0f172a').slice(3, 5), 16);
        const b = parseInt((g.bgColor || '#0f172a').slice(5, 7), 16);
        el.style.backgroundColor = `rgba(${r}, ${gCol}, ${b}, ${(g.bgAlpha ?? 85) / 100})`;

        // Alineación de logo
        el.className = el.className.replace(/logo-\w+/g, '');
        el.classList.add(`logo-${g.logoPos || 'left'}`);

        // Textos
        const l1 = el.querySelector('.g-l1');
        l1.textContent = g.linea1;
        l1.style.fontSize = (g.size1 || 24) + 'px';
        l1.style.color = g.color1;

        const l2 = el.querySelector('.g-l2');
        l2.textContent = g.linea2;
        l2.style.fontSize = (g.size2 || 14) + 'px';
        l2.style.color = g.color2;

        // Render de Icono / Emoji / Logo
        const img = el.querySelector('.g-img');
        const emoji = el.querySelector('.g-emoji');

        if (g.usarLogo) {
          if (g.tipoIcono === 'imagen' && g.logoUrl) {
            emoji.style.display = 'none';
            if (img.src !== g.logoUrl) img.src = g.logoUrl;
            img.style.display = 'block';
            img.style.width = (g.logoSize || 36) + 'px';
            img.style.height = (g.logoSize || 36) + 'px';
          } else {
            img.style.display = 'none';
            img.removeAttribute('src');
            emoji.textContent = g.emojiIcono || '🎙️';
            emoji.style.display = 'inline-block';
            emoji.style.fontSize = (g.logoSize || 36) + 'px';
            emoji.style.lineHeight = '1';
          }
        } else {
          img.style.display = 'none';
          emoji.style.display = 'none';
        }

        // Lógica de Animación
        if (g.visibilidad) {
          if (!el.classList.contains('is-visible')) {
            el.classList.remove('hidden', `out-${g.animSalida}`);
            el.classList.add('is-visible', `in-${g.animEntrada}`);
          }
        } else {
          if (el.classList.contains('is-visible')) {
            el.classList.remove('is-visible', `in-${g.animEntrada}`);
            el.classList.add(`out-${g.animSalida}`);
            setTimeout(() => {
              if (!el.classList.contains('is-visible')) {
                el.classList.add('hidden');
              }
            }, 500);
          }
        }
      });
    });

    socket.on('reproducir-sonido', (sonido) => {
      new Audio(`sonidos/${sonido}.mp3`).play().catch(e => console.error(e));
    });
  </script>
</body>
</html>
